##############################################################################
#  Greate 非官方重制版 —— 目标环境版本矩阵
#  MC 1.21.1 / NeoForge 21.1.219 / Create 6.0.10-281 / GTCEu 7.0.2
#
#  版本来源：
#    Create 6.0.10-281 的 neoforge.mods.toml 声明 neoforge = [21.1.219,)，
#    故 neo_version 不低于 21.1.219；GTCEu 7.0.2 声明 neoforge = [21.1,)。
##############################################################################

# Gradle daemon 不需要 3G；留给游戏进程，避免 16G 机器上互相挤
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ---- Minecraft / 加载器 ----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.219
neo_version_range=[21.1.219,)
loader_version_range=[4,)

# ---- 映射 ----
# Parchment 按 MC 版本分坐标；1.21.1 有独立发布（2024.11.13 / 2024.11.17）
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---- 模组自身 ----
mod_id=greate_remake
mod_name=Greate Remake
mod_license=MIT
mod_version=0.1.0
mod_group_id=electrolyte.greate
mod_authors=chai
mod_description=Unofficial remake of Greate (MIT, by Electrolyte & lonevox) for Create 6 / GTCEu 7 on 1.21.1. Not affiliated with the original authors.

# ---- 目标依赖 ----
create_version=6.0.10-281
create_version_range=[6.0.10,)
# 与 create-6.0.10-281.jar 内 jarJar 内嵌版本完全一致
ponder_version=1.0.82+mc1.21.1
# 与 create-6.0.10-281.jar 内 jarJar 内嵌版本完全一致
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
jei_version=19.21.0.247
mixin_extras_version=0.5.0-rc.3

# ---- GregTech CEu ----
gregtech_version=7.0.2
gregtech_version_range=[7.0.2,)
gtceu_ldlib_version=1.0.35.a
# GT 7.0.2 的 POM 写 3.1.0-neoforge，但该版本从未发布（仓库只有 3.1.1）；
# 运行时会用 gtceu.jar 内 jarJar 内嵌的 3.1.0，编译期用 3.1.1 即可
# 兜底：gtceu-7.0.2.jar!/META-INF/jarjar/configuration-1.21.1-3.1.0-neoforge.jar
gtceu_configuration_version=3.1.1-neoforge

# ============================================================================
# HTTP 代理（可选，默认关闭；公开仓库里不留任何具体地址）
#
# Gradle 不读取 HTTP_PROXY 环境变量。如果直连 maven.neoforged.net 报
# "Connection timed out: getsockopt ... configure the proxy settings"，
# 就把下面 5 行取消注释并填上你自己的代理端口。
#
# nonProxyHosts 按 host 分流：代理会截断大文件下载，所以只让确实需要的站点走代理，
# 其余（createmod / gtceu / maven central 等）直连。
# ============================================================================
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
#systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]|*.createmod.net|*.gtceu.com|*.firstdarkdev.xyz|repo.repsy.io|maven.blamejared.com|maven.parchmentmc.org|*.mojang.com|*.minecraft.net|repo1.maven.org|*.gradle.org|*.gradle.com
